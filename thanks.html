<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Received — The Encore Sushi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root { --dark: #1a1209; --amber: #d4953a; --cream: #fdf6ec; --mist: #6b7280; }
    body { font-family: "DM Sans", sans-serif; background: var(--cream); color: var(--dark); margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; }
    .card { padding: 3rem 1.5rem; max-width: 560px; }
    h1 { font-family: "Cormorant Garamond", serif; font-size: clamp(36px, 6vw, 56px); font-weight: 600; line-height: 1.05; margin: 0 0 1.25rem; }
    .rule { width: 48px; height: 2px; background: var(--amber); margin: 0 auto 1.5rem; }
    p { font-size: 16px; line-height: 1.7; color: var(--mist); margin: 0 0 2rem; }
    a.back { display: inline-block; font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--dark); text-decoration: none; border-bottom: 1px solid var(--amber); padding-bottom: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Thank you — request received</h1>
    <div class="rule"></div>
    <p>We've received your reservation request and will confirm by email or phone shortly.<br>
    Need us right away? Call <a href="tel:7602070435" style="color:var(--dark)">(760) 207-0435</a>.</p>
    <a class="back" href="/">Back to The Encore Sushi</a>
  </div>
</body>
</html>
